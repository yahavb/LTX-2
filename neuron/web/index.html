<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTX-2.5 live on AWS Trainium</title>
<style>
  :root { --bg: #111; --fg: #f5f5f5; --muted: #bbb; --accent: #ffb000; --btn: #2a2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, button, textarea { font: inherit; color: var(--fg); background: var(--btn);
    border: 2px solid #555; border-radius: 8px; padding: 10px 16px; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 4px solid var(--accent); }
  button.primary { background: #0a6; border-color: #0a6; }
  button.stop { background: #a22; border-color: #a22; }
  button:disabled { opacity: .45; }
  textarea { width: 100%; min-height: 4.2em; resize: vertical; }
  #view { position: relative; width: 100%; aspect-ratio: 768 / 512; background: #000; border-radius: 8px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .glass { background: rgba(10, 14, 20, .28); backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%); border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 8px; color: #e8f4ff; font: 600 13px/1.3 ui-monospace, monospace; letter-spacing: .04em; }
  #hud { position: absolute; top: 8px; left: 8px; max-width: 60%; padding: 4px 8px; white-space: pre-wrap;
    font-size: clamp(9px, 1.05vw, 12px); pointer-events: none; }
  #status { color: var(--muted); min-height: 1.5em; margin-top: 10px; }
  label.chk { display: flex; gap: 8px; align-items: center; }
  input[type=checkbox] { width: 22px; height: 22px; }
</style></head>
<body><main>
  <h1>LTX-2.5 live on AWS Trainium</h1>
  <div class="row">
    <label>Backend <select id="be" aria-label="Backend">__BACKENDS__</select></label>
    <button id="start" class="primary">Start</button>
    <button id="stopBtn" class="stop" disabled>Stop</button>
    <label class="chk"><input type="checkbox" id="live" checked> Continuous</label>
  </div>
  <div class="row">
    <textarea id="prompt" aria-label="Prompt">gentle ripples spreading across the calm lake water, tree leaves swaying softly in the breeze, clouds drifting slowly across the blue sky, cinematic slow camera push-in, serene natural motion</textarea>
  </div>
  <div id="view">
    <video id="v" playsinline aria-label="Generated video with audio"></video>
    <div id="hud" class="glass" aria-hidden="true"></div>
  </div>
  <div id="status" role="status" aria-live="polite">Checking the backend...</div>
</main>
<script>
const $ = id => document.getElementById(id);
const be = $("be"), v = $("v"), st = $("status"), hud = $("hud"), startB = $("start"), stopB = $("stopBtn");
let queue = [], ctrl = null, chunks = 0, t0 = 0, genSum = 0;
const say = t => { st.textContent = t; };
function playNext() { if (v.src && !v.ended && !v.paused) return; const u = queue.shift(); if (!u) return;
  if (v.src) URL.revokeObjectURL(v.src); v.src = u; v.play().catch(() => {}); }
v.addEventListener("ended", playNext);
async function status() {
  if (ctrl) return;
  try { const r = await (await fetch("api/status?backend=" + be.value)).json();
    if (r.ready) { say(`Ready (${be.value}). Press Start.`); startB.disabled = false; }
    else { say(`The ${be.value} backend is starting: it compiles on first start (about 1 to 2 hours). This page updates by itself.`);
      startB.disabled = true; } }
  catch (e) { say("The web app cannot reach its server."); }
}
status(); setInterval(status, 10000); be.onchange = status;
startB.onclick = async () => {
  if (ctrl) ctrl.abort(); ctrl = new AbortController(); queue = []; chunks = 0; genSum = 0; t0 = performance.now();
  startB.disabled = true; stopB.disabled = false; say("Generating the first chunk...");
  let r;
  try { r = await fetch("api/session", { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
    body: JSON.stringify({ backend: be.value, prompt: $("prompt").value, live: $("live").checked }) }); }
  catch (e) { say("Could not start: " + e); ctrl = null; status(); return; }
  if (!r.ok) { say("Could not start: " + await r.text()); ctrl = null; stopB.disabled = true; status(); return; }
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  try { for (;;) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 2);
      if (!line.startsWith("data: ")) continue; const ev = JSON.parse(line.slice(6));
      if (ev.mp4) { const b = Uint8Array.from(atob(ev.mp4), c => c.charCodeAt(0));
        queue.push(URL.createObjectURL(new Blob([b], { type: "video/mp4" }))); chunks++; genSum += ev.gen_s; playNext();
        const fps = (49 / ev.gen_s).toFixed(1);
        hud.textContent = `chunk ${chunks}  gen ${ev.gen_s}s  ${fps} fps` + (ev.vae_s ? `  vae ${ev.vae_s}s` : "");
        say(`Playing. Chunk ${chunks} generated in ${ev.gen_s} seconds.`); }
      else if (ev.error) say("Error: " + ev.error);
      else if (ev.superseded) say("Another session took over.");
      else if (ev.done) say(`Done: ${ev.chunks} chunks.`); } } } catch (e) {}
  ctrl = null; startB.disabled = false; stopB.disabled = true;
};
stopB.onclick = async () => { if (ctrl) ctrl.abort(); ctrl = null; stopB.disabled = true; startB.disabled = false;
  await fetch("api/stop?backend=" + be.value, { method: "POST" }).catch(() => {}); say("Stopped."); };
</script></body></html>
